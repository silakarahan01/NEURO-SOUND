{% comment %}
Yeniden kullanılabilir confirm modal — NS.confirm() Promise döner.
base.html dinamik olarak include eder; her sayfada otomatik kullanılabilir.
{% endcomment %}
<div id="ns-confirm-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ns-confirm-title">
    <div class="modal-dialog">
        <h3 id="ns-confirm-title" data-role="title" class="text-lg font-semibold text-white mb-3">Onay</h3>
        <p data-role="message" class="text-stone-300 text-sm leading-relaxed mb-6">
            Bu işlemi yapmak istediğinize emin misiniz?
        </p>
        <div class="flex flex-col sm:flex-row-reverse gap-2">
            <button type="button" data-role="confirm"
                    class="px-5 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-white font-medium transition">
                Onayla
            </button>
            <button type="button" data-role="cancel"
                    class="px-5 py-2 rounded-lg bg-stone-800 hover:bg-stone-700 border border-white/10 text-stone-300 font-medium transition">
                İptal
            </button>
        </div>
    </div>
</div>
