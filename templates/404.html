{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı (404) — NEURO SOUND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/neurosound.css' %}">
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div class="fixed inset-0 bg-gradient-to-br from-purple-900/30 via-stone-900/50 to-violet-900/30"></div>

    <div class="relative z-10 max-w-lg w-full text-center">
        <div class="glassmorphism rounded-3xl border border-white/10 p-10 shadow-2xl">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-violet-600 to-purple-700 rounded-full mb-6 shadow-lg shadow-violet-500/40">
                <i class="fas fa-compass text-4xl text-white" aria-hidden="true"></i>
            </div>

            <h1 class="text-7xl font-bold gradient-text mb-2">404</h1>
            <h2 class="text-2xl font-semibold text-white mb-3">Sayfa Bulunamadı</h2>
            <p class="text-stone-400 mb-8">
                Aradığınız sayfa kaldırılmış, taşınmış ya da hiç var olmamış olabilir.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="/" class="px-6 py-3 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 text-white font-semibold hover:from-violet-700 hover:to-purple-700 transition-all shadow-lg">
                    <i class="fas fa-home mr-2" aria-hidden="true"></i> Ana Sayfa
                </a>
                <button type="button" onclick="history.back()" class="px-6 py-3 rounded-xl bg-stone-800 border border-stone-700 text-stone-300 font-semibold hover:bg-stone-700 transition-all">
                    <i class="fas fa-arrow-left mr-2" aria-hidden="true"></i> Geri Dön
                </button>
            </div>
        </div>
    </div>
</body>
</html>
